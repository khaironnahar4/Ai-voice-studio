name: Keep Services Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Worker
        run: |
          curl -sSf -o /dev/null -w "Render status: %{http_code}\n" https://ai-voice-studio-unqu.onrender.com/health || echo "⚠️ Render ping failed"

      - name: Ping HF Space
        run: |
          curl -sSf -o /dev/null -w "HF Space status: %{http_code}\n" https://khairun247-vocera-tts.hf.space/health || echo "⚠️ HF Space ping failed"